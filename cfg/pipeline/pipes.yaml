make_lut:
  assets_out:
    lut: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/lut.npy"
  assets_in:
    cmb_map: {stage: make_sims}
    obs_maps: {stage: make_sims}
  dir_name: B_LUT

get_dataset_stats:
  assets_out:
    dataset_stats: 
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/feature_stats.yaml"
  assets_in:
    cmb_map: {stage: make_sims}
    obs_maps: {stage: make_sims}
  splits: 
    - train
  dir_name: C_PreprocessingPrep

preprocess_maps:
  assets_out:
    obs_maps:
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/obs_prep_{freq}.npy"
  assets_in:
    obs_maps: {stage: make_sims}
    dataset_stats: {stage: get_dataset_stats}
    lut: {stage: make_lut}
  dir_name: D_Prep_Observs
  splits:
    - train
    - valid
    - test

preprocess_spectra:
  assets_out:
    cmb_ps:
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_prep.txt"
      # handler: NumpyPowerSpectrum
      # path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_prep.npy"
  assets_in:
    cmb_ps: {stage: make_theory_ps, working: Simulation_Working/}
  dir_name: E_Prep_Spectra
  splits:
    - train
    - valid
    - test

train:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
  assets_in:
    cmb_ps: {stage: preprocess_spectra}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - train
    - valid
  dir_name: F_Model
  make_stage_log: True

# predict:
predict: &final_inference
  assets_out:
    cmb_ps: 
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.txt"
      # handler: NumpyPowerSpectrum
      # path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.npy"
  assets_in:
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs}
  dir_name: G_Predict
  make_stage_log: True

final_infer: *final_inference  # Used so that analysis code can find a consistent name

make_ps:
  assets_out:
    auto_real:
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/ps_real.npy"
      handler: NumpyPowerSpectrum
  assets_in:
    cmb_map_real: {stage: make_sims, orig_name: cmb_map}
    mask:    {stage: make_mask}  # Remove or set to null for no masking;
                                 #   set stage: to make_mask for the common mask
                                 #   set stage: to mask_in for the original mask (will be downgraded)
    mask_sm: {stage: make_mask}  # Remove or set to null for no masking;
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_J_Real_Power_Spectra

ps_analysis:
  assets_out:
    report:
      fn: ""
      path_template: "{root}/{dataset}/{working}{stage}/ps_report.csv"
      handler: PandasCsvHandler
  assets_in:
    theory_ps: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
    # auto_real: {stage: make_pred_ps}
    auto_pred: {stage: predict, orig_name: cmb_ps}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  override_n_sims: ${n_test_cap}
  # wmap_n_ps: 50
  dir_name: Analysis_H_PS_Report

ps_agg:
  assets_out:
    agg_report:
      fn: ""
      path_template: "{root}/{dataset}/{working}{stage}/ps_agg_report.csv"
      handler: PandasCsvHandler
  assets_in:
    report: {stage: ps_analysis}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  override_n_sims: ${n_test_cap}
  dir_name: Analysis_H_PS_Report

show_chosen_ells:
  assets_out:
    fig: 
      handler: Figure
      path_template: "{root}/{dataset}/{working}{stage}/chosen_ells.png"
  assets_in:
    ps_prep: {stage: preprocess_spectra, orig_name: cmb_ps}
    ps_thry: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_L_Show_Chosen_Ells
  make_stage_log: False

show_predictions:
  assets_out:
    fig: 
      handler: Figure
      path_template: "{root}/{dataset}/{working}{stage}/predictions_{epoch}.png"
  assets_in:
    ps_pred: {stage: predict, orig_name: cmb_ps}
    # ps_prep: {stage: preprocess_spectra, orig_name: cmb_ps}
    ps_thry: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
    report: {stage: ps_agg, orig_name: agg_report}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_M_Show_Predictions
  make_stage_log: False

loss_plot:
  assets_out:
    fig:
      handler: Figure
      path_template: "{root}/{dataset}/{working}{stage}/loss_plot.png"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_N_Loss_Plot
  make_stage_log: False



check_model_size:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
  assets_in:
    cmb_ps: {stage: preprocess_spectra}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_N_Check_Model_Size
  make_stage_log: False

bundle:
  assets_out:
    ps_pred: 
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/ps_pred_e{epoch}.npy"
    ps_real:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/ps_real.npy"
    ps_thry:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/ps_theory.npy"
  assets_in:
    ps_pred: {stage: predict, orig_name: cmb_ps}
    ps_real: {stage: make_ps, orig_name: auto_real}
    ps_thry: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_K_Bundle
  # make_stage_log: True
  make_stage_log: False 

