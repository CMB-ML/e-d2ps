defaults:
  - assembly_on_sims_fcn
  - pipes_on_sims
  - _self_

raw:
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template:  "{src_root}/CMB-ML/bulk_theory_dl.npy"

bundle_true:
  splits: [valid, test]
bundle_real:
  splits: [valid, test]
bundle_maps:
  splits: [valid, test]

# get_px_map_stats:
#   assets_out:
#     cmb_map:
#       path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_px_stats.npy"
#     obs_maps: 
#       path_template: "{root}/{dataset}/${prep_working_dir}{stage}/obs_px_stats_{freq}.npy"

get_dyn_map_stats:
  assets_out:
    cmb_map:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_px_stats.npy"
    cmb_scalar:
      handler: Config
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_px_scalar_stats.json"
  assets_in:
    cmb_ps: {stage: raw, orig_name: ps_bundle}
  dir_name: C_PreprocessingPrep

make_ps:
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template: "{root}/{dataset}/Simulation_Working/{stage}/theory_dl.npy"
  dir_name: Dyn_Prod_CMB_Spectra
  make_stage_log: False

model_init:
  assets_out:
    model:
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/${nn_model}_${fcn_string}_init_{model_num}.pth"

train_dyn_prod:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
    other_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/{record_type}_record.csv"
  assets_in:
    cmb_ps: {stage: raw, orig_name: ps_bundle}
    cmb_map: {stage: bundle_maps, orig_name: map_bundle}
    resume_model: {stage: train_dyn_prod, orig_name: model}
    initial_model: {stage: model_init, orig_name: model}
    pos_enc_lut: {stage: make_pos_enc_lut}
    cmb_stats: {stage: get_dyn_map_stats, orig_name: cmb_map, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
  splits:
    - valid
  dir_name: F_Model
  make_stage_log: True
