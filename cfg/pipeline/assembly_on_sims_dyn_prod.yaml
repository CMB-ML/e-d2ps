defaults:
  - assembly_on_sims_fcn
  - pipes_on_sims
  - _self_

raw:
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template:  "{src_root}/CMB-ML/bulk_theory_dl.npy"

bundle_true:
  splits: [valid]
bundle_real:
  splits: [valid]
bundle_maps:
  splits: [valid]

