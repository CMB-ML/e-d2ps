predict: &final_inference # G_predict.py / PredictExecutor
  assets_out:
    cmb_ps: 
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.txt"
      # handler: NumpyPowerSpectrum
      # path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.npy"
  assets_in:
    cmb_map: {stage: preprocess_maps}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
    mask:
      stage: arrange_masks
      working: ${prep_working_dir}
    pos_enc_lut: {stage: make_pos_enc_lut}
    mean_ps: {stage: get_spectra_stats}
    stdv_ps: {stage: get_spectra_stats}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs}
  dir_name: G_Predict
  make_stage_log: True

loss_summary: # _loss_summary.py / LossSummaryExecutor
  assets_out:
    summary:
      handler: TextHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_summary.txt"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_Figures
  make_stage_log: False
