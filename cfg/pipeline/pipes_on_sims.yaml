make_lut:  # B_make_lut.py / MakeLutExecutor
  assets_out:
    lut: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/lut.npy"
  dir_name: B_LUT

get_dataset_stats: # C_find_dataset_stats_parallel.py / FindDatasetStatsParallelExecutor
  assets_out:
    dataset_stats: 
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/feature_stats.yaml"
  assets_in:
    cmb_map: {stage: make_sims}
    obs_maps: {stage: make_sims}
  splits: 
    - train
  dir_name: C_PreprocessingPrep

preprocess_maps: # D_preprocess_maps_serial.py / PreprocessMapsExecutor
  assets_out:
    obs_maps:
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/obs_prep_{freq}.npy"
    cmb_map:
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_prep.npy"
  assets_in:
    obs_maps:
      stage: make_sims
    cmb_map: 
      stage: make_sims
    dataset_stats:
      stage: get_dataset_stats
    lut:
      stage: make_lut
  dir_name: D_Prep_Observs
  splits:
    - train
    - valid
    - test

preprocess_spectra: # E_preprocess_ps_serial.py / PreprocessSpectraExecutor
  assets_out:
    cmb_ps:
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_prep.txt"
      path_template_alt: "{root}/{dataset}/{working}{stage}/{split}/cmb_ps_prep.txt"
      # handler: NumpyPowerSpectrum
      # path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_prep.npy"
  assets_in:
    cmb_ps:
      stage: make_theory_ps
      working: Simulation_Working/
  dir_name: E_Prep_Spectra
  splits:
    - train
    - valid
    - test

train: # _check_model_size.py / CheckGPULoadExecutor AND F_train.py / TrainingExecutor
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
  assets_in:
    # cmb_ps: {stage: preprocess_spectra}
    cmb_ps: {stage: preprocess_spectra}
    cmb_map: {stage: preprocess_maps}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - train
    - valid
  dir_name: F_Model
  make_stage_log: True

# predict:
predict: &final_inference # G_predict.py / PredictExecutor
  assets_out:
    cmb_ps: 
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.txt"
      # handler: NumpyPowerSpectrum
      # path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.npy"
  assets_in:
    cmb_map: {stage: preprocess_maps}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs}
  dir_name: G_Predict
  make_stage_log: True

final_infer: *final_inference  # Used so that analysis code can find a consistent name

show_chosen_ells: # _show_chosen_ells.py / ShowChosenEllsExecutor
  assets_out:
    fig: 
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/chosen_ells.{fig_type}"
  assets_in:
    ps_prep: {stage: preprocess_spectra, orig_name: cmb_ps}
    ps_thry: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_L_Show_Chosen_Ells
  make_stage_log: False

loss_plot: # _loss_plot.py / LossPlotExecutor
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/loss_plot.{fig_type}"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_Figures
  make_stage_log: False

loss_summary: # _loss_summary.py / LossSummaryExecutor
  assets_out:
    summary:
      handler: TextHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_summary.txt"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_Figures
  make_stage_log: False

check_model_size:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
  assets_in:
    cmb_ps: {stage: preprocess_spectra}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_N_Check_Model_Size
  make_stage_log: False

# per_split_analysis is used in fig_rel_error, fig_cosmic_var, fig_chi_square
per_split_analysis:  # K_per_split_analysis.py / PerSplitAnalysis
  assets_out:
    per_vector_report:
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{metric}_ep_{epoch}.txt"
    per_scalar_report:
      handler: PandasCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/{split}/metrics_ep_{epoch}.csv"
  assets_in:
    ps_pred: {stage: predict, orig_name: cmb_ps}
    ps_thry: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_K_per_split_analysis
  make_stage_log: False

fig_rel_error:  # __show_rel_err_old.py / ShowRelativeError
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_A_rel_error_{split}_ep_{epoch}.{fig_type}"
  assets_in:
    per_vector_report: {stage: per_split_analysis}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Figures
  make_stage_log: False

fig_cosmic_var:  #  __show_cosmic_fractions.py / ShowCosmicFractions
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_B_cosmic_var_{split}_ep_{epoch}.{fig_type}"
  assets_in:
    per_vector_report: {stage: per_split_analysis}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Figures
  make_stage_log: False

fig_chi_square:  # __show_chi_square.py / ShowChiSquare
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_C_chi_square_{split}_ep_{epoch}.{fig_type}"
  assets_in:
    per_vector_report: {stage: per_split_analysis}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Figures
  make_stage_log: False

# ps_analysis used in ps_agg, show_predictions_indiv, show_predictions_bw
ps_analysis:  # H_ps_analysis.py / PowerSpectrumAnalysisExecutor
  assets_out:
    report:
      fn: ""
      path_template: "{root}/{dataset}/{working}{stage}/ps_report.csv"
      handler: PandasCsvHandler
  assets_in:
    theory_ps: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
    # auto_real: {stage: make_pred_ps}
    auto_pred: {stage: predict, orig_name: cmb_ps}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  override_n_sims: ${n_test_cap}
  # wmap_n_ps: 50
  dir_name: Analysis_H_PS_Report

# ps_agg is used in I_ps_agg.py; results are used in show_predictions (_show_predictions)
ps_agg: # I_ps_agg.py / PowerSpectrumAggExecutor
  assets_out:
    agg_report:
      fn: ""
      path_template: "{root}/{dataset}/{working}{stage}/ps_agg_report.csv"
      handler: PandasCsvHandler
  assets_in:
    report: {stage: ps_analysis}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  override_n_sims: ${n_test_cap}
  dir_name: Analysis_H_PS_Report

show_predictions: # _show_predictions.py / ShowPredictionsExecutor
  assets_out:
    fig: 
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_D_predictions_{split}_ep_{epoch}.{fig_type}"
  assets_in:
    ps_pred: {stage: predict, orig_name: cmb_ps}
    # ps_prep: {stage: preprocess_spectra, orig_name: cmb_ps}
    ps_thry:
      stage: make_theory_ps
      orig_name: cmb_ps
      working: Simulation_Working/
    report: {stage: ps_agg, orig_name: agg_report}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Figures
  make_stage_log: False

