planck_data:
  assets_out:
    obs_maps:
      handler: NumpyMap
      path_template: "{root}/{dataset}/d2ps-prep/D_Prep_Observs_Planck/Test/sim0000/obs_prep_{freq}_${px_arrange}_${model.scale_px}.npy"

make_theory_ps:
  assets_out:
    cmb_ps:
      handler: DictCambPowerSpectrum

make_lut:  # B_make_lut.py / MakeLutExecutor
  assets_out:
    lut: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/lut_{style}.npy"
  dir_name: B_LUT

make_pos_enc_lut:  # B_make_pos_enc_lut.py / MakePosEncLutExecutor
  assets_out:
    pos_enc_lut: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/pos_enc_lut_{style}.npy"
  assets_in:
    lut: {stage: make_lut}
  dir_name: B_LUT

get_dataset_stats: # C_find_dataset_stats_parallel.py / FindDatasetStatsParallelExecutor
  assets_out:
    dataset_stats: 
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/feature_stats.yaml"
  assets_in:
    cmb_map: {stage: make_sims, working: Simulation_Working/}
    obs_maps: {stage: make_sims, working: Simulation_Working/}
  splits: 
    - train
  dir_name: C_PreprocessingPrep

get_px_map_stats: # C3_find_map_stats_serial.py / FindPxMapStatsExecutor
  assets_out:
    cmb_map: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/cmb_px_stats.npy"
      # path_template: "{root}/{dataset}/{working}{stage}/cmb_px_stats_beam_{map_prep_beam}d.npy"
    obs_maps: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/obs_px_stats_{freq}.npy"
      # path_template: "{root}/{dataset}/{working}{stage}/obs_px_stats_{freq}_{map_prep_beam}d.npy"
  assets_in:
    cmb_map: {stage: make_sims, working: Simulation_Working/}
    obs_maps: {stage: make_sims, working: Simulation_Working/}
  splits: 
    - train
  dir_name: C_PreprocessingPrep

get_spectra_stats: # C2_find_ps_stats_serial / FindSpectraStatsExecutor
  assets_out:
    mean_ps:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/ps_mean.npy"
    stdv_ps:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/ps_stdv.npy"
  assets_in:
    cmb_ps:
      stage: make_theory_ps
      working: Simulation_Working/
  splits:
    - train
  dir_name: C_PreprocessingPrep    

preprocess_maps: # D_preprocess_maps_serial.py / PreprocessMapsExecutor
  assets_out:
    obs_maps:
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/obs_prep_{freq}_{px_arrange}_{scale}.npy"
    cmb_map:
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_prep_{px_arrange}_{scale}.npy"
  assets_in:
    obs_maps: {stage: make_sims}
    cmb_map: {stage: make_sims}
    obs_stats: {stage: get_px_map_stats, orig_name: obs_maps}
    cmb_stats: {stage: get_px_map_stats, orig_name: cmb_map}
    dataset_stats: {stage: get_dataset_stats}
    lut: {stage: make_lut}
  dir_name: D_Prep_Observs
  splits:
    - train
    - valid
    - test

preprocess_mask: # D2_preprocess_mask.py / PreprocessMaskExecutor
  assets_out:
    mask:
      handler: NumpyMap
      path_template: "{root}/{dataset}/{working}{stage}/mask_{px_arrange}.npy"
  assets_in:
    mask: {stage: make_mask}
    lut: {stage: make_lut}
  dir_name: D_Prep_Observs
  splits:
    - train

preprocess_spectra: # E_preprocess_ps_serial.py / PreprocessSpectraExecutor
  assets_out:
    cmb_ps:
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_prep_${model.scale_ps}.txt"
  assets_in:
    cmb_ps:
      stage: make_theory_ps
      working: Simulation_Working/
    mean_ps: {stage: get_spectra_stats}
    stdv_ps: {stage: get_spectra_stats}
  dir_name: E_Prep_Spectra
  splits:
    - train
    - valid

check_model_size:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
  assets_in:
    cmb_ps: {stage: preprocess_spectra}
    obs_maps: {stage: preprocess_maps}
    model: {stage: train}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_N_Check_Model_Size
  make_stage_log: False

model_init:
  assets_out:
    model:
      handler: PyTorchModel
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/${model_fn_template}.pth"
  dir_name: F_Model_Init

train: # _check_model_size.py / CheckGPULoadExecutor AND F_train.py / TrainingExecutor
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
    other_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/{record_type}_record.csv"
    pl_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/pl_record.csv"
    ell_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/ell_record.csv"
    trgt_stats:
      handler: NpzHandler
      path_template: "{root}/{dataset}/{working}{stage}/trgt_stats.npz"  # Contains, ell, mean, std for target
    predictions:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}_Preds/preds_ep{epoch}.npy"
  assets_in:
    cmb_ps: {stage: preprocess_spectra}
    cmb_map: {stage: preprocess_maps}
    obs_maps: {stage: preprocess_maps}
    pl_obs: {stage: planck_data, orig_name: obs_maps}
    resume_model: {stage: train, orig_name: model}
    initial_model: {stage: model_init, orig_name: model}
    pos_enc_lut: {stage: make_pos_enc_lut}
    mean_ps: {stage: get_spectra_stats}
    stdv_ps: {stage: get_spectra_stats}
    mask:
      stage: preprocess_mask
      working: ${prep_working_dir}
  splits:
    - train
    - valid
  dir_name: F_Model
  make_stage_log: True

