planck_data:
  assets_out:
    obs_maps:
      handler: NumpyMap
      path_template: "{root}/{dataset}/d2ps-prep/D_Prep_Observs_Planck/Test/sim0000/obs_prep_{freq}_${px_arrange}_${model.scale_px}.npy"

make_theory_ps:
  assets_out:
    cmb_ps:
      handler: DictCambPowerSpectrum

get_monopole:  # D5_get_monopole.py / GetMonopoleExecutor
  n_workers: ${model.preprocess.n_workers}
  assets_out:
    monopole:
      handler: Config
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/monopole_{gal_mask_source}.yaml"
  assets_in:
    obs_maps: {stage: make_sims, working: Simulation_Working/}
    mask: {stage: compose_masks}
  splits:
    - train
  dir_name: C_PreprocessingPrep

make_lut:  # B_make_lut.py / MakeLutExecutor
  assets_out:
    lut: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/lut_{style}.npy"
  dir_name: B_LUT

make_pos_enc_lut:  # B_make_pos_enc_lut.py / MakePosEncLutExecutor
  assets_out:
    pos_enc_lut: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/pos_enc_lut_{style}.npy"
  assets_in:
    lut: {stage: make_lut}
  dir_name: B_LUT

get_dataset_stats: # C_find_dataset_stats_parallel.py / FindDatasetStatsParallelExecutor
  assets_out:
    dataset_stats: 
      handler: Config
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/feature_stats.yaml"
  assets_in:
    cmb_map: {stage: make_sims, working: Simulation_Working/}
    obs_maps: {stage: make_sims, working: Simulation_Working/}
  splits: 
    - train
  dir_name: C_PreprocessingPrep

get_px_map_stats: # C3_find_map_stats_serial.py / FindPxMapStatsExecutor
  assets_out:
    cmb_map: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_px_stats.npy"
      # path_template: "{root}/{dataset}/{working}{stage}/cmb_px_stats_beam_{map_prep_beam}d.npy"
    obs_maps: 
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/obs_px_stats_{freq}.npy"
      # path_template: "{root}/{dataset}/{working}{stage}/obs_px_stats_{freq}_{map_prep_beam}d.npy"
  assets_in:
    cmb_map: {stage: make_sims, working: Simulation_Working/}
    obs_maps: {stage: make_sims, working: Simulation_Working/}
  splits: 
    - train
  dir_name: C_PreprocessingPrep

get_spectra_stats: # C2_find_ps_stats_serial / FindSpectraStatsExecutor
  assets_out:
    mean_ps:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/ps_mean.npy"
    stdv_ps:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/ps_stdv.npy"
  assets_in:
    cmb_ps:
      stage: make_theory_ps
      working: Simulation_Working/
  splits:
    - train
  dir_name: C_PreprocessingPrep    

preprocess_maps: # D_preprocess_maps_serial.py / PreprocessMapsExecutor
  assets_out:
    obs_maps:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/{split}/{sim}/obs_prep_{freq}_{px_arrange}_{scale}.npy"
    cmb_map:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/{split}/{sim}/cmb_prep_{px_arrange}_{scale}.npy"
  assets_in:
    obs_maps: {stage: make_sims}
    cmb_map: {stage: make_sims}
    obs_stats: {stage: get_px_map_stats, orig_name: obs_maps}
    cmb_stats: {stage: get_px_map_stats, orig_name: cmb_map}
    dataset_stats: {stage: get_dataset_stats}
    lut: {stage: make_lut}
  dir_name: D_Prep_Observs
  splits:
    - train
    - valid
    - test

preprocess_mask: # D2_preprocess_mask.py / PreprocessMaskExecutor
  assets_out:
    mask:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/mask_{px_arrange}.npy"
  assets_in:
    mask: {stage: make_mask}
    lut: {stage: make_lut}
  dir_name: D_Prep_Observs
  splits:
    - train

prep_nilc_mask: # D3_preprocess_masks.py / PrepGalNILCMaskExecutor
  assets_out:
    mask:
      handler: HealpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/mask_gal_nilc.fits"
  assets_in:
    mask: {stage: raw, orig_name: mask_nilc_map}
  dir_name: D2_Prep_Masks

prep_point_source_mask: # D3_preprocess_masks.py / PrepPSMaskExecutor
  ps_mask_lmax: 2000
  ps_mask_iters: null
  assets_out:
    mask:
      handler: HealpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/mask_ps_{freq}.fits"
  assets_in:
    mask:   {stage: raw, orig_name: mask_point_source_map}
  dir_name: D2_Prep_Masks

prep_galcut_mask: # D3_preprocess_masks.py / PrepGalCutMaskExecutor
  gal_cuts: [20, 40, 60, 70, 80]
  assets_out:
    mask:
      handler: HealpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/mask_{gal_cut}.fits"
  assets_in:
    mask:  {stage: raw, orig_name: mask_gal_cut_apo_0_map}
  dir_name: D2_Prep_Masks

compose_masks:
  assets_out:
    mask:
      handler: HealpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/ps_gal_mask_{freq}_{gal_mask}.fits"
  assets_in:
    galcut_mask: {stage: prep_galcut_mask, orig_name: mask}
    ps_mask: {stage: prep_point_source_mask, orig_name: mask}
    nilc_mask: {stage: prep_nilc_mask, orig_name: mask}
  dir_name: D2_Prep_Masks

arrange_masks: # D_arrange_masks.py / ArrangeMasksExecutor
  assets_out:
    mask:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/mask_{freq}_{gal_mask}_{px_arrange}.npy"
    note:
      handler: Config
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/mask_{freq}_{gal_mask}_{px_arrange}.yaml"
  assets_in:
    mask: {stage: compose_masks}
    lut: {stage: make_lut}
  dir_name: D2_Arrange_Masks

