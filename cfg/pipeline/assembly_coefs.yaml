defaults:
  - assembly_on_sims_sepprep
  - pipes_on_sims
  - _self_

prep_get_polycoef: # E1_prep_coef_get_coef.py / PreprocessGetSpectraCoefExecutor
  assets_out:
    cmb_ps_coef:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}_cmb_ps_coef_${basis_kind}_${degree}.npy"
  assets_in:
    ps_bundle:
      stage: bundle_true
  dir_name: E_Prep_Coefs
  splits:
    - train
    - valid

prep_stat_polycoef: # E2_prep_coef_get_stats.py / PreprocessStatSpectraCoefExecutor
  assets_out:
    coef_stats:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/cmb_ps_${basis_kind}_${degree}_stats.npy"
  assets_in:
    cmb_ps_coef: {stage: prep_get_polycoef}
  dir_name: E_Prep_Coefs
  splits:
    - train

prep_scale_polycoef: # E3_prep_coef_process.py / PreprocessPrepSpectraCoefExecutor
  assets_out:
    cmb_ps_coef:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}_cmb_ps_prep_${basis_kind}_${degree}.npy"
  assets_in:
    coef_stats: {stage: prep_stat_polycoef}
    cmb_ps_coef: {stage: prep_get_polycoef}
  dir_name: E_Prep_Coefs
  splits:
    - train
    - valid

