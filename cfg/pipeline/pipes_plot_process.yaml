loss_plot: # _loss_plot.py / LossPlotExecutor
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/loss_plot.{fig_type}"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_Figures
  make_stage_log: False

loss_delta_plot: # _loss_plot.py / LossDeltaPlotExecutor
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/loss_plot_delta.{fig_type}"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_Figures
  make_stage_log: False
