# Bundling
bundle_maps: # Z_bundle_maps.py / BundleMapsExecutor
  assets_out:
    map_bundle:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/cmb_maps_{split}.npy"
  assets_in:
    cmb_map: {stage: make_cmb_only, orig_name: cmb_map, working: Simulation_Working/}
  splits: [train, valid, test]
  dir_name: &bundle_raw Raw_Bundle
  make_stage_log: False

bundle_true: # Z_bundle.py / BundleTrueExecutor
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/true_{split}.npy"
  assets_in:
    ps: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working/}
  splits: ${splits.run_inference_on}
  dir_name: *bundle_raw
  make_stage_log: False

bundle_pred: # Z_bundle.py / BundlePredExecutor
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}/pred_{split}_{epoch}.npy"
  assets_in:
    # ps: {stage: predict, orig_name: cmb_ps}
    ps: ???
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: &bundle_pred Analysis_Bundle
  make_stage_log: False

bundle_real: # Z_bundle.py / BundleRealExecutor
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}/real_{split}.npy"
  assets_in:
    ps: {stage: make_real_ps, orig_name: auto_real, working: Real_PS/}
  splits: ${splits.run_inference_on}
  dir_name: *bundle_pred
  make_stage_log: False

find_sm_degree:
  assets_out:
    deg_cfg:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/degree.yaml"
  assets_in:
    ps_pred_bundle: {stage: bundle_pred, orig_name: ps_bundle}
    ps_thry_bundle: {stage: bundle_true, orig_name: ps_bundle}
  splits:
    - valid
  epochs: ${use_epochs_ps_stats}
  dir_name: *bundle_pred
  make_stage_log: False

bundle_smooth:
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}/pred_{split}_{epoch}_smooth.npy"
  assets_in:
    pred: {stage: bundle_pred, orig_name: ps_bundle}
    deg_cfg: {stage: find_sm_degree}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: *bundle_pred
  make_stage_log: False

get_per_ell_metrics:
  metrics: 
    - mse
    - rel_err
    - abs_rel_err_pct
    - thry_var
    - pred_var
    - tension
    - R2
    - ceiling_r2
    - loss_calib
    - loss_bias
  assets_out:
    per_ell_metric:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}/metric_{metric}_{split}_{epoch}.npy"
  assets_in:
    pred: {stage: bundle_smooth, orig_name: ps_bundle}
    thry: {stage: bundle_true, orig_name: ps_bundle}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Metrics
  make_stage_log: True

get_per_sim_metrics:
  metrics: ["mse", "abs_rel_err_pct", "bias"]
  assets_out:
    per_sim_metric:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}/simmetric_{metric}_{split}_{epoch}.npy"
  assets_in:
    pred: {stage: bundle_smooth, orig_name: ps_bundle}
    thry: {stage: bundle_true, orig_name: ps_bundle}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Metrics
  make_stage_log: False