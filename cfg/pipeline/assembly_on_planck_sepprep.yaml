show_predictions_peaks: # _show_predictions_peaks.py / ShowPredictionsPeaksExecutor
  assets_out:
    fig: 
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_D_predictions_{split}_ep_{epoch}_peaks_PLANCK.{fig_type}"
