defaults:
  - /pipeline/fig_stage@plot_mse: per_ell
  - /pipeline/fig_stage@plot_r2: per_ell
  - /pipeline/fig_stage@plot_tension: per_ell
  - /pipeline/fig_stage@plot_abs_rel_err_pct: per_ell
  - _self_

plot_mse:
  metrics: "mse"
  display:
    ylim: [20, 2e6]
plot_tension:
  metrics: "tension"
plot_r2:
  metrics: "R2"
  display:
    ylim: [0, 1]
plot_abs_rel_err_pct:
  metrics: abs_rel_err_pct
  display:
    ylim: [0, 20]

plot_variance:
  metrics: ["pred_var", "thry_var"]
  metric: pred_var
  theory_metric: thry_var
  display:
    ylim: [1e3, 1e6]
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_L_{metric}_{split}.{fig_type}"
  assets_in:
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
    per_ell_metric: {stage: get_per_ell_metrics}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True

model_vs_theory_tension:
  metrics:
    - pred_var
    - tension
  bottom_metric: tension
  band_alpha: 0.2
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_M_tall_panel_{split}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_smooth, orig_name: ps_bundle}
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
    per_ell_metric: {stage: get_per_ell_metrics}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True

plot_single_sim_results:
  thry_band: cosm_var
  realizations: [0, 1, 2]
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_R_fixed_{split}_{realization}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_smooth, orig_name: ps_bundle}
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True

plot_single_sim_results_ranked:
  thry_band: cosm_var
  rank_metric: mse
  n_show: 3
  # rank_abs: True      # for a signed metric such as bias
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_R_{split}_{realization}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_smooth, orig_name: ps_bundle}
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
    per_sim_metric: {stage: get_per_sim_metrics}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True

plot_prediction_cloud:
  band_alpha: 0.15
  mark_peaks: True
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_C_cloud_{split}_{norm}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_smooth, orig_name: ps_bundle}
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True

plot_r2_decomposition:
  metrics: ["ceiling_r2", "loss_calib", "loss_bias", "R2"]
  ceiling_metric: ceiling_r2
  loss_metrics: ["loss_bias", "loss_calib"]     # stacking order, outermost first
  total_metric: R2
  exemplar: 0                                   # null to drop the top panel
  exemplar_display:
    ylim: [0, 7500]
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_D_r2budget_{split}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_smooth, orig_name: ps_bundle}
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
    per_ell_metric: {stage: get_per_ell_metrics}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True

plot_paired_realizations:
  n_show: 5
  mark_peaks: True
  display:
    ylim: [0, 7000]
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_P_peaks_{split}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_smooth, orig_name: ps_bundle}
    # ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True


