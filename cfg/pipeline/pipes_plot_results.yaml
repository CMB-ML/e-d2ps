plot_base:
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_E_indiv_pred_{split}_ep_{epoch}_{sim}.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_pred, orig_name: ps_bundle}
    ps_thry: {stage: bundle_true, orig_name: ps_bundle, working: Simulation_Working/}
    per_ell_metric: {stage: generate_metrics}
  splits: ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Figures
  make_stage_log: True

