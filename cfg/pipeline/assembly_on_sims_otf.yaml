defaults:
  - assembly_sim_cmb_only
  - pipes_on_sims
  - _self_

raw:
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template:  "{src_root}/CMB-ML/bulk_theory_dl.npy"

bundle_true:
  splits: [valid]
bundle_real:
  splits: [valid]
bundle_maps:
  splits: [valid]

get_dyn_stats:
  assets_out:
    map_stats:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_px_stats.npy"
    rps_stats:
      handler: NpyHandler
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_real_ps_stats.npy"
  assets_in:
    cmb_ps: {stage: raw, orig_name: ps_bundle}
  dir_name: C_PreprocessingPrep

dyn_bundle:
  assets_out:
    ps_thry:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/true_{split}.npy"
    ps_real:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/real_{split}.npy"
    cmb_map:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/cmb_maps_{split}.npy"
  assets_in:
    cmb_ps: {stage: raw, orig_name: ps_bundle}
  splits: [valid]
  dir_name: Raw_Bundle
  make_stage_log: False

model_init:
  assets_out:
    model:
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/${nn_model}_${fcn_string}_init_{model_num}.pth"

train_dyn_prod:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
    other_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/{record_type}_record.csv"
  assets_in:
    train_cmb_ps : {stage: raw, orig_name: ps_bundle}
    valid_thry_ps: {stage: dyn_bundle, orig_name: ps_thry}
    valid_real_ps: {stage: dyn_bundle, orig_name: ps_real}
    valid_map    : {stage: dyn_bundle, orig_name: cmb_map}
    resume_model : {stage: train_dyn_prod, orig_name: model}
    initial_model: {stage: model_init, orig_name: model}
    pos_enc_lut  : {stage: make_pos_enc_lut}
    # TODO: Rename to use next line instead of following
    # map_stats    : {stage: get_dyn_stats, orig_name: map_local, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
    cmb_stats    : {stage: get_dyn_stats, orig_name: map_stats, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
    rps_stats    : {stage: get_dyn_stats, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv real ps
  splits:
    - valid
  dir_name: F_Model
  make_stage_log: True
