defaults:
  - assembly_sim_cmb_only
  - pipes_on_sims
  - _self_

raw:
  assets_out:
    ps_bundle:
      handler: NpyHandler
      path_template:  "{src_root}/CMB-ML/bulk_theory_dl_scale${sigma_scale}.npy"

bundle_true:
  splits: [valid]
bundle_real:
  splits: [valid]
bundle_maps:
  splits: [valid]

get_otf_stats:
  assets_out:
    map_stats:
      handler: NumpyMap
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_px_stats_scale${sigma_scale}.npy"
    rps_stats:
      handler: NpyHandler
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/cmb_real_ps_stats_scale${sigma_scale}.npy"
  assets_in:
    cmb_ps: {stage: raw, orig_name: ps_bundle}
  dir_name: C_PreprocessingPrep

otf_fixed:
  assets_out:
    ps_thry:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/true_{split}_scale${sigma_scale}.npy"
    ps_real:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/real_{split}_scale${sigma_scale}.npy"
    cmb_map:
      handler: NpyHandler
      path_template: "{root}/{dataset}/{stage}/cmb_maps_{split}_scale${sigma_scale}.npy"
  assets_in:
    cmb_ps: {stage: raw, orig_name: ps_bundle}
  splits: [valid, test]
  dir_name: Raw_Bundle
  make_stage_log: False

model_init:
  assets_out:
    model:
      path_template: "{root}/{dataset}/${prep_working_dir}{stage}/${model_fn_template}.pth"

train_otf:
  assets_out:
    model: 
      handler: PyTorchModel
      path_template: "{root}/{dataset}/{working}{stage}/model_{epoch}.pth"
    loss_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.csv"
    other_record:
      handler: AppendingCsvHandler
      path_template: "{root}/{dataset}/{working}{stage}/{record_type}_record.csv"
  assets_in:
    dl_bank      : {stage: raw, orig_name: ps_bundle}
    valid_thry_ps: {stage: otf_fixed, orig_name: ps_thry}
    valid_real_ps: {stage: otf_fixed, orig_name: ps_real}
    valid_map    : {stage: otf_fixed, orig_name: cmb_map}
    resume_model : {stage: train_otf, orig_name: model}
    initial_model: {stage: model_init, orig_name: model}
    pos_enc_lut  : {stage: make_pos_enc_lut, working: "${prep_working_dir}"}
    lut          : {stage: make_lut, working: "${prep_working_dir}"}
    # TODO: Rename to use next line instead of following
    # map_stats    : {stage: get_otf_stats, orig_name: map_local, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
    cmb_stats    : {stage: get_otf_stats, orig_name: map_stats, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
    rps_stats    : {stage: get_otf_stats, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv real ps
  splits:
    - valid
  dir_name: F_Model
  make_stage_log: True

log_to_parquet:
  assets_out:
    loss_parquet:
      handler: PandasParquetHandler
      path_template: "{root}/{dataset}/{working}{stage}/loss_record.parquet"
  assets_in:
    loss_record: {stage: train_otf}
  dir_name: F_Model
  make_stage_log: False

infer_otf:
  assets_out:
    cmb_ps: 
      handler: NpyHandler
      path_template: "{root}/{dataset}/{working}{stage}/pred_{split}_{epoch}.npy"
      # handler: NumpyPowerSpectrum
      # path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.npy"
  assets_in:
    model        : {stage: train_otf}
    dl_bank      : {stage: raw, orig_name: ps_bundle}
    cmb_map      : {stage: otf_fixed}
    resume_model : {stage: train_otf, orig_name: model}
    initial_model: {stage: model_init, orig_name: model}
    pos_enc_lut  : {stage: make_pos_enc_lut, working: "${prep_working_dir}"}
    lut          : {stage: make_lut, working: "${prep_working_dir}"}
    # TODO: Rename to use next line instead of following
    # map_stats    : {stage: get_otf_stats, orig_name: map_local, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
    cmb_stats    : {stage: get_otf_stats, orig_name: map_stats, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv maps
    rps_stats    : {stage: get_otf_stats, working: "${prep_working_dir}"}  # Contains min, max, mean, stdv real ps
  splits: [valid, test]
  dir_name: G_Infer
  make_stage_log: True

show_preds_otf: # _show_preds.py / OTFShowPredsExecutor
  assets_out:
    fig: 
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_D_predictions_{split}_ep_{epoch}.{fig_type}"
  assets_in:
    ps_pred: {stage: infer_otf, orig_name: cmb_ps}
    ps_thry: {stage: otf_fixed, orig_name: ps_thry}
    ps_real: {stage: otf_fixed, orig_name: ps_real}
  splits:
    - ${splits.run_inference_on}
  epochs: ${use_epochs_ps_stats}
  dir_name: Analysis_Figures
  make_stage_log: False

show_train_stats_plots: # _show_preds.py / OTFShowPredsExecutor
  assets_out:
    fig: 
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_E_train_{stat}.{fig_type}"
  assets_in:
    loss_record: {stage: train, orig_name: loss_record}
  dir_name: Analysis_Figures
  make_stage_log: False
