defaults:
  - _self_
  - assembly_sim
  - pipes_on_sims

make_cheap_real_ps:
  assets_out:
    cmb_ps:
      handler: TextPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_cheap_real.txt"
  assets_in:
    cmb_ps: {stage: make_theory_ps}
  dir_name: Simulation_K_Cheap_Realization_PS
  splits: &all_splits
    - train
    - test
    - valid

# Bundling
ps_bundle: # D_gather_ps.py / BundleExecutor
  assets_out:
    ps_bundle:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{src}_ps_{ellmax}_{split}.npy"
  assets_in:
    thry_ps: {stage: make_theory_ps, orig_name: cmb_ps, working: Simulation_Working_sph2ps/}
    real_ps: {stage: make_cheap_real_ps, orig_name: cmb_ps, working: Simulation_Working_sph2ps/}
  splits: *all_splits
  dir_name: &bundle_path A_Bundle
  make_stage_log: False

prep_spectra:
  assets_out:
    spectra_stats:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/spectra_stats_{split}.yaml"
  assets_in:
    ps_bundle: {stage: ps_bundle}
  splits: *all_splits
  dir_name: B_Prep
  make_stage_log: False

params_bundle:
  assets_out:
    params_bundle:
      handler: NumpyPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/params_{split}.npy"
  assets_in:
    cosmo_config: {stage: make_cosmo_configs, working: Simulation_Working_sph2ps/}
  splits: *all_splits
  dir_name: *bundle_path
  make_stage_log: False

prep_params:
  assets_out:
    param_stats:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/param_stats_{split}.yaml"
  assets_in:
    params_bundle: {stage: params_bundle}
  splits: *all_splits
  dir_name: B_Prep
  make_stage_log: False
