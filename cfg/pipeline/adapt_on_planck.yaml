# This patches over pipes_on_sims so that CMB-ML knows where to look
#   as it processes the downgraded Planck dataset.
# Some directories needed are "source only;" no data will be written.
# The following directory structure is assumed.
# ...root/Datasets
#   - Planck as dataset "Planck Dir" (source only)
#   - Dataset used for training
#       - Working directory for training "Training Dir" (source only)
#       - Output when using Planck as dataset with trained model

adjust_zero_level:
  assets_out:
    obs_maps:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{stage}/{split}/{sim}/obs_{freq}_map_Zero_Adj.fits"
  assets_in:
    obs_maps: 
      stage: convert_obs
      dataset: ${planck_ds}
    mask: {stage: compose_masks}
    monopole: {stage: get_monopole}
  splits: &test_only
    - test
  dir_name: Simulation_Planck

preprocess_maps: # D_preprocess_maps_serial.py / PreprocessMapsExecutor
  assets_in:
    # Pull maps from Planck Dir
    cmb_map:
      dataset: ${planck_ds}
    # For disabling the zero'd Plancks in a side-by-side test, switch these and change output paths
    # obs_maps:
    #   dataset: ${planck_ds}
    obs_maps: {stage: adjust_zero_level}
    # Pull processing parameters from Training Dir
    lut:
      working: ${trained_wd}
    dataset_stats:
      working: ${trained_wd}
  dir_name: D_Prep_Observs_Planck
  # There is only the "Test" split
  splits: *test_only

preprocess_spectra: # E_preprocess_ps_serial.py / PreprocessSpectraExecutor
  assets_in:
    cmb_ps:
      dataset: ${planck_ds}
  dir_name: E_Prep_Spectra_Planck 
  splits: *test_only

predict: &final_inference # G_predict.py / PredictExecutor
  assets_in:
    model:
      working: ${trained_wd}
  dir_name: G_Predict_on_Planck
  splits: *test_only

# show_predictions: # _show_predictions.py / ShowPredictionsExecutor
#   assets_out:
#     fig:
#       # Change file name
#       path_template: "{root}/{dataset}/{working}{stage}/planck_predictions_{epoch}.{fig_type}"
#   assets_in:
#     ps_thry:
#       dataset: ${planck_ds}

# ps_analysis used in ps_agg, show_predictions_indiv, show_predictions_bw
ps_analysis:  # H_ps_analysis.py / PowerSpectrumAnalysisExecutor
  dir_name: Analysis_H_PS_Report_Planck

bundle_true: # Z_bundle.py / BundleTrueExecutor
  assets_out:
    ps_bundle:
      path_template: "{root}/{dataset}/{stage}/true_planck.npy"
  splits: test

bundle_pred: # Z_bundle.py / BundlePredExecutor
  assets_out:
    ps_bundle:
      path_template: "{root}/{dataset}/{stage}/pred_planck.npy"
  splits: test

plot_single_sim_results:
  realizations: [0]
  assets_out:
    fig:
      handler: MPLFigure
      path_template: "{root}/{dataset}/{working}{stage}/fig_R_fixed_planck.{fig_type}"
  assets_in:
    ps_pred: {stage: bundle_pred, orig_name: ps_bundle}  # not bundle_smooth, like in d2ps_comp
    ps_thry: {stage: bundle_true, orig_name: ps_bundle}
  splits: ${splits.run_inference_on}
  dir_name: Analysis_Figures
  make_stage_log: True
