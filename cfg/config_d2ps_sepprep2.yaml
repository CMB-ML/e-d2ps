# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_

# !!! Be sure to end working_dir with / 
working_dir        : "D2PS_Multi_LR/${features_type}2ps_${learning_rate}/"
prep_working_dir   : "d2ps-prep/"
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      learning_rate:  2e-6, 5e-6, 1e-5, 2e-5, 5e-5, 1e-4, 2e-4

iter_num: 0
learning_rate: 2e-4  # Baseline parameter we've used
