# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_

hydra:
  mode: MULTIRUN
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}  # Should be the same as run.dir
    subdir     : ${hydra.job.num}               # Subsequent jobs will include duplicate logs for all previous jobs. 
                                                #   This is a minor bug, not worth fixing.
  verbose      : false
  sweeper:
    params:
      learning_rate: 5e-6, 1e-5, 2e-5
      iter_num: 1, 2, 3
      activation: relu, gelu
n_sims: 5
iter_num: 0
learning_rate: 0
activation: null

splits:
  Train:
    n_sims: ${n_sims}
