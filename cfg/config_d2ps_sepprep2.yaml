# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_

# !!! Be sure to end working_dir with / 
working_dir        : "${features_type}2ps_${splits.n_sims}/"
# working_dir        : "D2PS_Multiple_Repeats/${features_type}2ps_${iter_num}/"
prep_working_dir   : "d2ps-prep/"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      n_sims    :  500, 250
  
n_sims: 0
