# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_
working_dir        : "Multi_${features_type}2ps_${splits.Train.n_sims}_300ep_bs${batch_size}/iter_${iter_num}/"
prep_working_dir   : "d2ps-prep/"
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # batch_size: 5, 50
      iter_num: 1, 2, 3, 4, 5

batch_size: 5
iter_num: 0

splits:
  Train:
    n_sims: 500
