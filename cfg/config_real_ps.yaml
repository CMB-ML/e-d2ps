defaults:
  - local_system   : generic_lab
  - file_system    : common_fs
  - pipeline       : assembly_surr_real_ps
  - scenario       : scenario
  # - splits         : all_2000
  - splits         : all
  - model          : basic_d2ps_nn_l2
  - model/sim      : sim
  - model/analysis : basic_analysis
  - model/analysis/metrics : metrics
  - override hydra/job_logging: custom_log
  - _self_

dataset_name: "${map_fields}_${scenario.nside}_${splits.name}_broad_dist"
cleaning_model: "Realization_PS"
fig_model_name: "Realization Spectra"
working_dir : "Real_PS/"

hydra:
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  verbose          : false

fig_type      : png

sigma_scale: 1
sm_basis_kind: "polyfit"  # Use np.polyfit, the fastest by ~4x.
                          # Alternatives (chebyshev, legendre, monomial) use scikit-learn.
                          # Results agree to ~10 decimal places. 
sm_deg_range: [4,30]
sm_criterion: "mean_r2"
use_epochs           : [""]
do_smooth            : true
sm_score_ell_max     : null

pipeline:
  raw:
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template:  "{src_root}/CMB-ML/bulk_theory_dl_scale${sigma_scale}.npy"
  bundle_pred:
    assets_in:
      ps: ${pipeline.bundle_real.assets_in.ps}

# Settings below this point are used for interpolation.
# These are not to be used directly in the python
# They are picked up from here and MAY be used elsewhere in the yamls.
# In the scenario yaml
nside          : 512
detectors      : [30, 44, 70, 100, 143, 217, 353, 545, 857]
map_fields     : "I"

lmax           : 1280

# For prediction, postprocessing, power spectra generation:
# For single simulation figures (maps & ps figures):
use_epochs_imgs      : ${use_epochs}
# For summary statistics:
use_epochs_map_stats : ${use_epochs}
# For summary statistics:
use_epochs_ps_stats  : ${use_epochs}
# Limit the number of simulations for which to generate figures
n_show_cap           : 10

# Limit the number of simulations on which to do inference and postprocessing
# In the splits yaml; null to run on all
n_infer_cap           : null
run_inference_on      : [test, valid]
