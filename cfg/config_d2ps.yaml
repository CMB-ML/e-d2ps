# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - local_system   : generic_lab
  - file_system    : common_fs
  - pipeline       : assembly_on_sims
  - scenario       : scenario
  - splits         : all_big
  - model          : basic_d2ps_nn_l2
  - model/patches  : toppatch
  - model/analysis : simple_apo
  - model/analysis/metrics    : metrics
  - override hydra/job_logging: custom_log
  - _self_

dataset_name       : "${map_fields}_${scenario.nside}_20850"
# SimpleEncDec
working_dir        : &wd "${features_type}2ps_${nn_model}_train_reruns_find_down/Nsims-${n_sims}_lr-${learning_rate_final}_lre-${learning_rate_ramp_epochs}_${optimizer}_wd-${adamw_wd}_sps-${scale_ps}_spx-${model.scale_px}_pe-${use_pos_enc_lut}_en-${norm_kind}_${activation}_r1-${down_reductions}_r2-${spatial_reduction}_${model_num}/"
fig_model_name     : "${features_type} to PS, \n Nsims: ${n_sims}, PS Scale:${scale_ps} px Scale:${model.scale_px}, Pos. Enc.: ${use_pos_enc_lut} \n ${nn_model} with dr-${down_reductions}, sr-${spatial_reduction}, en-${norm_kind}, ${activation}, Model Init ${model_num} \n ${optimizer}, lr: ${learning_rate_final}, lr-epochs: ${learning_rate_ramp_epochs} wd: ${adamw_wd}"
## TLP
# working_dir        : ## &wd "${features_type}2ps_${nn_model}_BASECHANGEME/Nsims-${n_sims}_lr-${learning_rate}_${optimizer}_wd-${adamw_wd}_sps-${model.scale_ps}_spx-${model.scale_px}_pe-${use_pos_enc_lut}_en-${norm_kind}_${activation}_r1${down_reductions}_r2${spatial_reduction}_r3${face_reduction}_${model_num}/"
# fig_model_name     : ## "${features_type} to PS, Nsims: ${n_sims}, lr: ${learning_rate}, ${optimizer}, wd: ${adamw_wd} \n PS Scale:${model.scale_ps} px Scale:${model.scale_px} Pos. Enc.: ${use_pos_enc_lut}, en-${norm_kind}, ${activation}, ${down_reductions}, {spatial_reduction}, {face_reduction}, Model Init ${model_num}"

trained_wd         : *wd
prep_working_dir   : "d2ps-prep-rerun/"
pl_fig_model_name  : "${features_type} to PS, On Planck, PS Scale:${scale_ps} px Scale:${model.scale_px}, Pos. Enc.: ${use_pos_enc_lut} \n ${nn_model} with ${down_reductions}, ${spatial_reduction}, en-${norm_kind}, ${activation}, Model Init ${model_num} \n ${optimizer}, lr: ${learning_rate}, wd: ${adamw_wd}"


