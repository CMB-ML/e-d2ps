# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - local_system   : generic_lab
  - file_system    : common_fs
  - pipeline       : assembly_on_sims
  - scenario       : scenario
  - splits         : all_big
  - model          : basic_d2ps_nn_l2
  - model/patches  : toppatch
  - model/analysis : simple_apo
  - model/analysis/metrics    : metrics
  - override hydra/job_logging: custom_log
  - _self_

dataset_name       : "${map_fields}_${scenario.nside}_20850"
working_dir        : &wd "${features_type}2ps_${nn_model}_MR/Nsims-${n_sims}_lr-${learning_rate}_${optimizer}_scale-${model.scale_ps}_pe-${use_pos_enc_lut}_en-${norm_kind}_${activation}_pool-${pooling}_${model_num}/"
# working_dir        : &wd "${features_type}2ps_${nn_model}_MR/Nsims-${n_sims}_lr-${learning_rate}_${optimizer}_wd-${adamw_wd}_scale-${model.scale_ps}_pe-${use_pos_enc_lut}_en-${norm_kind}_${activation}_${model_num}/"
trained_wd         : *wd
prep_working_dir   : "d2ps-prep/"
fig_model_name     : "${features_type} to PS, Nsims: ${n_sims}, lr: ${learning_rate}, ${optimizer}, \n scale:${model.scale_ps} Pos. Enc.: ${use_pos_enc_lut}, en-${norm_kind}, ${activation}, ${pooling}-pool, Model Init ${model_num}"
pl_fig_model_name  : "${features_type} to PS, On Planck"

###############################################################
#   Leave this section on in dev- branches; turn off in run-
###############################################################
# model_num: ???
model_num: 1
model_num: 2
model_num: 3

learning_rate: ???
learning_rate_sweep: 5e-6, 1e-5, 2e-5

scale_ps: ???
scale_ps_sweep: 4000, null
scale_ps: 4000
scale_ps: null

optimizer: Adam
optimizer: AdamW
adamw_wd : 1e-5

use_pos_enc_lut: ???
use_pos_enc_lut_sweep: false, true
use_pos_enc_lut: false
use_pos_enc_lut: true

### Models: Either 
# nn_model: MobileViTCMBRegressor
# px_arrange: cmbNNCS
# norm_kind: gn

### Or
nn_model: SimpleEncDec
px_arrange: cmbNNCS
norm_kind: none
norm_kind: bn
norm_kind: gn
pooling: ???
pooling_sweep: max, avg
pooling: max
pooling: avg
activation: ???
activation_sweep: relu, gelu
activation: relu
activation: gelu

### Or
# nn_model: TLPEncAggDec
# nn_model: TLPEnc2AggDec
# px_arrange: channel
# norm_kind: none
# norm_kind: bn
# norm_kind: gn
# pooling: max
# pooling: avg
# activation: relu
# activation: gelu

###############################################################
#   Lesser-used set-up
###############################################################
n_sims: 5

splits:
  Train:
    n_sims: ${n_sims}

planck_ds: PlanckAsDataset_${scenario.nside}

fig_type: ['pdf', 'png']

# Limit the number of simulations for which to generate figures
n_show_cap           : 5
n_show_treble_ell    : null

# Settings below this point are used for interpolation.
# These are not to be used directly in the python
# They are picked up from here and MAY be used elsewhere in the yamls.
# In the scenario yaml
nside              : 128
lmax               : 1280
# nside              : 512  # When changing this, change mask apodization as well!

# Features type should be either "cmb" or "obs"
features_type      : cmb
# features_type      : obs
detectors          : [100, 143, 217, 353]
map_fields         : "I"

# In the model yaml
num_epochs         : 300
num_epochs         : 30000

# In the pipeline yamls
# For prediction, postprocessing, power spectra generation:
use_epochs           : ["final"]
# For single simulation figures (maps & ps figures):
use_epochs_imgs      : ${use_epochs}
# For summary statistics:
use_epochs_map_stats : ${use_epochs}
# For summary statistics:
use_epochs_ps_stats  : ${use_epochs}

# Limit the number of simulations on which to do inference and postprocessing
# In the splits yaml; null to run on all
n_infer_cap           : null
run_inference_on      : test   # Either "test" ("train" should work, but is not recommended)
run_inference_on      : train  # Either "test" ("train" should work, but is not recommended)
