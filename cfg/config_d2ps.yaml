# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - local_system   : generic_lab
  - file_system    : common_fs
  - pipeline       : assembly_on_sims
  - scenario       : scenario
  - splits         : all
  - model          : basic_d2ps_nn_l2
  - model/patches  : toppatch
  - model/analysis : simple_apo
  - model/analysis/metrics    : metrics
  - override hydra/job_logging: custom_log
  - _self_

dataset_name       : "${map_fields}_${scenario.nside}_${splits.name}"
# SimpleEncDec
working_dir        : &wd "${features_type}2ps_final/"
# working_dir        : &wd "${features_type}2ps_train/${nn_model}_Nsims-${n_sims}_lr-${learning_rate_final}_lre-${learning_rate_ramp_epochs}_${optimizer}_wd-${adamw_wd}_sps-${scale_ps}_spx-${model.scale_px}_pe-${use_pos_enc_lut}_en-${norm_kind}_${activation}_r1-${down_reductions}_r2-${spatial_reduction}_r3-${face_reduction}_${model_num}/"

model_name_base    : "PS Scale:${scale_ps} px Scale:${model.scale_px}, Pos. Enc.: ${use_pos_enc_lut} \n ${nn_model} with dr-${down_reductions}, sr-${spatial_reduction}, en-${norm_kind}, ${activation}, Model Init ${model_num} \n ${optimizer}, lr: ${learning_rate_final}, lr-epochs: ${learning_rate_ramp_epochs} wd: ${adamw_wd}"

fig_model_name     : "${features_type} to PS, \n Nsims: ${n_sims}, ${model_name_base}"
# fig_model_name     : "${features_type} to PS, \n Nsims: ${n_sims}, PS Scale:${scale_ps} px Scale:${model.scale_px}, Pos. Enc.: ${use_pos_enc_lut} \n ${nn_model} with dr-${down_reductions}, sr-${spatial_reduction}, fr-${face_reduction}, en-${norm_kind}, ${activation}, Model Init ${model_num} \n ${optimizer}, lr: ${learning_rate_final}, lr-epochs: ${learning_rate_ramp_epochs} wd: ${adamw_wd}"

trained_wd         : *wd
prep_working_dir   : "d2ps-prep/"
pl_fig_model_name  : "${features_type} to PS, On Planck, ${model_name_base}"


pipeline:
  raw:
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template:  "{src_root}/CMB-ML/bulk_theory_dl_scale${sigma_scale}.npy"
  bundle_true: # Z_bundle.py / BundleTrueExecutor
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template: "{root}/{dataset}/True/Analysis_Bundle/true_{split}.npy"
sigma_scale: 1


################################################################
#                                                              #
################################################################
n_sims_train_full: 1000   # 512

# # Normal training scheme
n_sims_train: 1000
n_sims_train_infer: 200
num_epochs: 300

return_mode: spectrum

model_num: ???
model_num_sweep: 1

scale_px: ???
scale_px_sweep: minmax_local

scale_ps: ???
scale_ps_sweep: meanstdv

spectrum_layer_kind: identity  # 'identity' (spectrum), 'poylnomial', or 'cosmo_param'
model_fn_template  : ${nn_model}_init_${model_num}

use_pos_enc_lut: ???
use_pos_enc_lut_sweep: false

optimizer: AdamW
adamw_wd : ???  # Due to interpolation, must be provided.
adamw_wd_sweep: 0.01

learning_rate_start: 1e-8

learning_rate_final: ???
learning_rate_final_sweep: 1e-5

learning_rate_ramp_epochs: ???
learning_rate_ramp_epochs_sweep: 0

## Models: Either 
nn_model: SimpleEncDec
px_arrange: cmbNNCS
norm_kind: ???
norm_sweep: gn
# Down reductions use X/m strings: X is max, m is avg; 
#   order starts with first/top layer and fills down 
#   XmX would be Max, Avg, Max, and the rest Avg
down_reductions: ???
down_reductions_sweep: mmmmmmm
spatial_reduction: ???
spatial_reduction_sweep: avg
activation: ???
activation_sweep: gelu

# ### Or
# # nn_model: TLPEncAggDec
# nn_model: TLPEnc2AggDec
# px_arrange: channel
# norm_kind: ???
# # norm_sweep: none, bn, gn
# norm_sweep: gn
# down_reductions: ???
# # for X-m strings: X is max, m is avg; order starts with first/top layer and fills down
# # down_reductions_sweep: max, avg, X, Xm, XXm, mXX
# down_reductions_sweep: mmmmmmm, Xmmmmmm  # CMML2
# down_reductions_sweep: mmmXmmm, mmmmmXm  # CMML3
# spatial_reduction: ???
# # spatial_reduction_sweep: avg, max
# spatial_reduction_sweep: avg
# activation: ???
# # activation_sweep: relu, gelu
# activation_sweep: gelu

# face_reduction: ???
# face_reduction_sweep: avg

### Or
# nn_model: MobileViTCMBRegressor
# px_arrange: cmbNNCS
# norm_kind: gn

################################################################
#   Lesser-used set-up
###############################################################
n_sims: ???

splits:
  Train:
    n_sims: ${n_sims}

planck_ds: PlanckAsDataset_${scenario.nside}

fig_type: ['pdf', 'png']

# Limit the number of simulations for which to generate figures
n_show_cap           : 5
n_show_treble_ell    : null

# Settings below this point are used for interpolation.
# These are not to be used directly in the python
# They are picked up from here and MAY be used elsewhere in the yamls.
# In the scenario yaml
nside              : 512
lmax               : 1280

# Features type should be either "cmb" or "obs"
# features_type      : cmb
features_type      : obs
detectors          : [100, 143, 217, 353]
map_fields         : "I"

# cosmo_param_names  : ["As", "H0", "ns", "ombh2", "omch2", "tau"]
# pivot_scalar       : 0.002  # For WMAP, use 0.002. For Planck, use CAMB
#                             # default of 0.05
# log_As             : false  # This should match the source distribution
#                             # Currently (WMAP), As is provided with mean 
#                             # and standard deviation *not* log-scaled. 
#                             # If we switch to Planck, change this to true

track_grad_norm: False

# In the pipeline yamls
# For prediction, postprocessing, power spectra generation:
use_epochs           : ["best"]
# For single simulation figures (maps & ps figures):
use_epochs_imgs      : ${use_epochs}
# For summary statistics:
use_epochs_map_stats : ${use_epochs}
# For summary statistics:
use_epochs_ps_stats  : ${use_epochs}

# Limit the number of simulations on which to do inference and postprocessing
# In the splits yaml; null to run on all
n_infer_cap           : null
run_inference_on      : test  # Either "test" ("train" should work, but is not recommended)