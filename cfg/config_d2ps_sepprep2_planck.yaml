defaults:
  - config_d2ps
  - override pipeline: assembly_on_planck_sepprep
  - override splits: "1-1"
  - _self_

working_dir        : "${features_type}2ps_${n_sims}/"
# working_dir        : "D2PS_Multiple_Repeats/${features_type}2ps_${iter_num}_on_Planck/"
prep_working_dir   : "d2ps-prep/"

planck_ds: PlanckAsDataset_${scenario.nside}
trained_wd: "${features_type}2ps_${n_sims}/"
# trained_wd: "D2PS_Multiple_Repeats/${features_type}2ps_${iter_num}/"

fig_model_name     : "${features_type} to PS, On Planck, ${features_type}2ps_${n_sims}/ Simulations"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      n_sims    :  500, 250
  
n_sims: 0
