# Consistent properties for all stages:
dtype     : float
scaling   : minmax  # minmax or null (for maps)
lmax      : ${lmax}  # lmax for prediction of power spectra
# Use ells follows numpy format [ell_min:ell_max:step] with multiple 
#   ranges separated by commas; e.g. "[2:11],[20:201:10]"
#   Remember that the max is not included in the range!
use_ells  : "[2:${lmax}:1]"
# use_ells  : "[2:31],[40:${lmax}:10]"
# Scaling the power spectra
#   Accepts: a float (a multiplier for the Dl)
#            "Cl" (convert Dl back to Cl, not recommended unless using matching loss)
#            null (no scaling)
# For non-Wishart loss function
scale_ps  : null
final_activation: null

# For Wishart loss function
# scale_ps  : Cl
# final_activation: softplus

# Other model parameters
n_init_features: 16
n_levels: 7  # For 128
# n_levels: 9
note: null

preprocess:
  n_workers : 50

train:
  # Operate on CPU or CUDA; null for auto selection.
  device            : null

  # Data loading
  batch_size        : 5
  num_loader_workers: 4
  # Training parameters
  learning_rate     : 0.0002

  # Epochs
  n_epochs          : ${num_epochs}
  restart_epoch     : null  # Set to null to create a new model, or give a checkpoint number

  # Checkpointing
  checkpoint_every  : 5     # checkpoint every this number of epochs
  extra_check       : [1, 2, 3, 4, 7, 9]  # Extra checkpoints to save
  # Above will output checkpoints at epochs 1, 2, 3, 5, 7, 9, 10, 15, 20, ...

  # loss: l1
  loss: l2
  # loss: wishart  # When using wishart, scale_ps must be set to "Cl" (above)

test:
  batch_size: 20
  device    : null
analysis:  # TODO: implement local settings for analysis procedures in models
  top_n:  3
  bottom_n: 3
  first_n: 0
#   fig_model_name : PatchNN
#   fig_model_dir  : PatchNN/
#   fig_model_color: "#2D1C24"