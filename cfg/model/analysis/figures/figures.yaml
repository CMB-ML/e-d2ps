# Appearance for the analysis figures.
#
# The drawing layer (d2ps_nn/utils/figures.py) holds no visual defaults, so
# everything it needs to style a figure comes from here. Per-model colour and
# label are NOT here -- they live with each model in cfg/model/cleaning/, so a
# model's appearance travels with the rest of its configuration.

# Canvases. figure_kwargs(cfg, canvas=...) picks one.
figure:
  figsize: [8, 5]
  dpi: 150

figure_tall:          # two-panel layouts (model vs theory with tension)
  figsize: [8, 10]
  dpi: 150

figure_cloud:
  figsize: [12, 7]
  dpi: 150

figure_wide:
  figsize: [12, 7]
  dpi: 150

theory_style:
  color: "black"
  fill: "gray"
  alpha: 0.4
  line_label: "Theory"
  band_label: "$\\pm \\sigma_{theory}$"

axis_labels:
  ell: "Multipole Moment $\\ell$"
  dl: "$D_\\ell$ $[\\mu K_\\mathrm{CMB}^2]$"
  # Shared across every D_ell panel -- the realization figures, the cloud's top
  # panel, the budget's exemplar -- so a "worst" realization and a "best" one
  # are read on the same scale. A stage's own display block overrides it.
  dl_ylim: [0, 7500]

# Per-metric display. A metric absent from here still plots: it falls back to
# its own name with a linear axis, and warns. yscale and ylim defaults can be
# overriden in pipeline yamls.
#
#   label   display name, for titles
#   ylabel  y-axis label, normally the units
#   yscale  omit for linear
#   ylim    omit to autoscale
metric_display:
  mse:
    label: "$MSE_\\ell$"
    ylabel: "$\\mu K_\\mathrm{CMB}^4$"
    yscale: log
  rel_err:
    label: "$RE_\\ell$ (signed)"
    ylabel: "fraction"
  abs_rel_err_pct:
    label: "$RE_\\ell$"
    ylabel: "$\\%$"
  tension:
    label: "Tension"
    ylabel: "Tension"
  R2:
    label: "$R^2_\\ell$"
    ylabel: "$R^2$"
  ceiling_r2:
    label: "$r^2_\\ell$"
    ylabel: "$r^2$"
  loss_calib:
    label: "$(A-r)^2_\\ell$"
    ylabel: "calibration loss"
  loss_bias:
    label: "$b^2_\\ell$"
    ylabel: "bias loss"
  cosm_var:
    label: "$\\sigma^2_\\mathrm{c.v.}$"
    ylabel: "$\\mu K_\\mathrm{CMB}^4$"
    yscale: log
  thry_var:
    label: "$\\sigma^2_{theory}$"
    ylabel: "$\\mu K_\\mathrm{CMB}^4$"
    yscale: log
  pred_var:
    label: "Variance $\\sigma^2$"
    ylabel: "$\\mu K_\\mathrm{CMB}^4$"
    yscale: log
  err_norm_thry:
    label: "Relative error"
    ylabel: "$(\\widehat D_\\ell-\\mathring D_\\ell)/\\mathring D_\\ell$"
    ylim: [-0.5, 0.5]
  err_norm_sd_thry:
    label: "Error in theory sigma"
    ylabel: "$(\\widehat D_\\ell-\\mathring D_\\ell)/\\sigma_{\\mathring D,\\ell}$"
    ylim: [-5, 5]
  r2_decomposition:
    label: "$R^2$ budget"
    ylabel: "$R^2_\\ell$ budget"
    ylim: [-1.05, 1.05]

annotation_style:
  x: 0.02
  y: 0.05
  fontsize: 9

# Cloud figure
cloud_style:
  trace_alpha: 0.25
  trace_lw: 0.25
  height_ratios: [1, 2.4]
  legend_fontsize: 8

cloud_peak_style:
  color: "0.15"
  linewidth: 0.45
  alpha: 0.35
  tick_frac: 0.025
  theory_linestyle: "-"
  pred_linestyle: "--"
  theory_where: top
  pred_where: bottom

# Decomposition
budget_style:
  height_ratios: [1, 2.4]
  ceiling_color: "0.3"
  ceiling_lw: 1.0
  achieved_lw: 1.2
  exemplar_theory_lw: 1.0
  exemplar_pred_lw: 0.8
  zero_line: true
  legend_loc: "lower right"
  legend_ncol: 2
  legend_fontsize: 7
loss_styles:
  loss_bias:
    color: "C3"
    alpha: 0.20
    label: "$b^2$  (bias loss)"
  loss_calib:
    color: "C1"
    alpha: 0.20
    label: "$(A-r)^2$  (calib. loss)"

# Paired Realizations
paired_realization_style:
  theory:
    linewidth: 0.5
    alpha: 1.0
  prediction:
    linewidth: 2.0
    alpha: 0.7
    dash_pattern: [5, 5]
paired_peak_style:
  linewidth: 1.0
  alpha: 1.0
  tick_frac: 0.04
  theory_where: top
  pred_where: bottom
