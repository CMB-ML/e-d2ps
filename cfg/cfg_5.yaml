# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_

hydra:
  mode: MULTIRUN
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}  # Should be the same as run.dir
    subdir     : ${hydra.job.num}               # Subsequent jobs will include duplicate logs for all previous jobs. 
                                                #   This is a minor bug, not worth fixing.
  verbose      : false
  sweeper:
    params:
      scale_ps: none
      scale_px: minmax_global
      optimizer: Adam
      learning_rate_final: 1e-3
      norm_kind: gn
      activation: gelu
      down_reductions: XXXXXXXXX
      spatial_reduction: max
      dropout_pos_enc: post_pool
      dropout_type_enc: drop2d
      dropout_rate: 0.0
      dropout_paradigm_name: no_drop

n_sims: ${n_sims_train}