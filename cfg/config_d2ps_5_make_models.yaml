defaults:
  - config_d2ps
  - _self_

working_dir        : ${prep_working_dir}

hydra:
  mode: MULTIRUN
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}  # Should be the same as run.dir
    subdir     : ${hydra.job.num}               # Subsequent jobs will include duplicate logs for all previous jobs. 
                                                #   This is a minor bug, not worth fixing.
  verbose      : false
  sweeper:
    params:
      use_pos_enc_lut: ${use_pos_enc_lut_sweep}
      activation: relu
      model_num: ${model_num_sweep}
      norm_kind: none          # Used as default value for model creation; overwritten in later stages
      down_reductions: max     # default value
      spatial_reduction: avg   # default value
      dropout_rate: 0.0
      dropout_pos_enc: post_pool  # MUST SWEEP OVER THIS
      dropout_type_enc: drop2d
      # degree: ${degree_sweep}
      # basis_kind: chebyshev  # Does not matter

      # For TLP models only
      # face_reduction: avg
