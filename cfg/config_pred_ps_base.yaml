defaults:
  - local_system   : generic_lab
  - file_system    : common_fs
  - pipeline       : assembly_surr_real_ps
  - scenario       : scenario
  - splits         : all_big       # For CMB-ML dataset
  # - splits         : all_2000       # For CMB-ML dataset
  # - splits         : "1-1"   # For on_Planck
  - model          : basic_d2ps_nn_l2
  - model/sim      : sim
  - model/analysis : basic_analysis
  - model/analysis/metrics : metrics
  - override hydra/job_logging: custom_log
  - _self_

splits:
  Valid:
    n_sims: 200

dataset_name: "${map_fields}_${scenario.nside}_${splits.name}"

# NEEDS ONE OF THE FOLLOWING, AS WELL AS CORRECT SPLIT
# working_dir : "cmbNNCS_UNet8/"
# fig_model_name: "cmbNNCS Spectra"
# n_show_cap           : 10
# use_epochs           : ["best"]

# working_dir : "cmbNNCS_UNet8_on_Planck/"
# fig_model_name: "cmbNNCS on Planck"
# n_show_cap           : 1
# use_epochs           : ["best"]

# working_dir : "PyILC_CNILC/"
# fig_model_name: "PyILC Spectra"
# n_show_cap           : 1
# use_epochs           : [""]

# working_dir : "PyILC_on_Planck/"
# fig_model_name: "PyILC Spectra"
# n_show_cap           : 1
# use_epochs           : [""]

fig_type      : [png, pdf]

sigma_scale: 1
# sm_basis_kind: chebyshev
sm_basis_kind: chebyshev
# sm_degree: 10
sm_degree: 18
out_range: [-1, 1]

pipeline:
  raw:
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template:  "{src_root}/CMB-ML/bulk_theory_dl_scale${sigma_scale}.npy"
  ps_analysis:
    assets_in:
      auto_pred: {stage: make_pred_ps, orig_name: auto_pred}
  per_split_analysis:
    assets_in:
      ps_pred: {stage: make_pred_ps, orig_name: auto_pred}
  show_predictions:
    assets_in:
      ps_pred: {stage: make_pred_ps, orig_name: auto_pred}
  show_predictions_bw:
    assets_in:
      ps_pred: {stage: make_pred_ps, orig_name: auto_pred}
  show_predictions_indiv:
    assets_in:
      ps_pred: {stage: make_pred_ps, orig_name: auto_pred}
  error_analysis:
    assets_in:
      ps_pred: {stage: make_pred_ps, orig_name: auto_pred}
  show_predictions_error_analysis:
    assets_in:
      ps_pred: {stage: make_pred_ps, orig_name: auto_pred}
  bundle_pred:
    assets_in:
      ps: {stage: make_pred_ps, orig_name: auto_pred}

hydra:
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  verbose          : false

# Settings below this point are used for interpolation.
# These are not to be used directly in the python
# They are picked up from here and MAY be used elsewhere in the yamls.
# In the scenario yaml
nside          : 128
detectors      : [100, 143, 217, 353]
map_fields     : "I"

lmax           : 1280

# For prediction, postprocessing, power spectra generation:
# For single simulation figures (maps & ps figures):
use_epochs_imgs      : ${use_epochs}
# For summary statistics:
use_epochs_map_stats : ${use_epochs}
# For summary statistics:
use_epochs_ps_stats  : ${use_epochs}
# Limit the number of simulations for which to generate figures

# Limit the number of simulations on which to do inference and postprocessing
# In the splits yaml; null to run on all
n_infer_cap           : null
run_inference_on      : valid  # Either "test" ("train" should work, but is not recommended)
