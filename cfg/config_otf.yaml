## SimpleEncDec
nn_model: SimpleEncDec
px_arrange: cmbNNCS
norm_kind: ???
# norm_sweep: none, bn, gn
norm_sweep: none, gn
# Down reductions use X/m strings: X is max, m is avg;
#   order starts with first/top layer and fills down 
#   XmX would be Max, Avg, Max, and the rest Avg
down_reductions: ???
down_reductions_sweep: avg  #, max, Xm, XXm, mXX
spatial_reduction: ???
# # spatial_reduction_sweep: avg, max
spatial_reduction_sweep: avg
activation: ???
# activation_sweep: relu, gelu
activation_sweep: gelu
use_pos_enc_lut: false
model:
  n_levels: 3
model_fn_template  : ${nn_model}_init_{model_num}_pe-${use_pos_enc_lut}_${fcn_string}
working_dir        : "otf_${features_type}2ps_${nn_model}/pred_${spectrum_type}-lr-${learning_rate}-lbl_${prep_label}-ftr_${prep_feature}_en-${norm_kind}_${activation}_r1-${down_reductions}_r2-${spatial_reduction}_fcn_str-${fcn_string}_${model_num}/"
fig_model_name     : "${features_type} to PS, \n PS Scale:${prep_label} px Scale:${prep_feature}, ${fcn_string} \n ${nn_model} with dr-${down_reductions}, sr-${spatial_reduction}, en-${norm_kind}, ${activation}, Model Init ${model_num} \n lr: ${learning_rate}"

