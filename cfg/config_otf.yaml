#   # model_init:
#   #   assets_out:
#   #     model:
#   #       path_template: "{root}/{dataset}/${prep_working_dir}{stage}/init_${model_init}_${n_hidden_features}_${input_kind}_${lmax}.pth"

################################################################
#                                                              #
################################################################
sim_engine         : cuhpx  # synfast or cuHPX
nside              : 32
lmax               : 64
fcn_str_sweep      : N_1536R_O

# nside              : 16
# lmax               : 32
# fcn_str_sweep      : N_384R_O

n_train_sims: ???
n_train_sims_sweep: 2048, 8192, 32768
# n_train_sims_sweep: 1024, 2048, 4096, 8192, 16384, 32768

# n_train_sims_sweep: Inf

splits:
  Valid:
    n_sims: 256

num_epochs         : 2000
train_batch_size   : 256
n_train_batches    : 4

input_kind         : maps  # Currently deprecated; requires new implementation of on-the-fly mechanics
spectrum_type      : ???
prep_label         : ???
prep_feature       : ???

spectrum_type_sweep: real  #, theory
# prep_feature_sweep : none, meanstdv_local, minmax_global, minmax_local, meanstdv_global
prep_feature_sweep : meanstdv_local
# prep_label_sweep   : none, meanstdv_global, meanstdv_local, minmax_global, minmax_local
prep_label_sweep   : meanstdv_local

model_num          : ???
model_num_sweep    : 1  #, 2, 3, 4, 5

learning_rate      : ???
# learning_rate_sweep: 1e-4
# learning_rate_sweep: 1e-5, 1e-3
learning_rate_sweep: 5e-4  #, 1e-4, 1e-3

# activation         : ???
# activation_sweep   : relu
# activation_sweep   : gelu, relu

sigma_scale          : ???
# sigma_scale_sweep  : 1, 2, 5, 10, 20
sigma_scale_sweep  : 2, 5, 10

fcn_string         : ???

############
### Models: 
############

## FCN Only (direct-from-pixel values)
nn_model           : fcn
px_arrange         : none
model_fn_template  : ${nn_model}_${fcn_string}_init_{model_num}
working_dir        : "otf_${features_type}2ps_${nn_model}_n_sims3/pred_${spectrum_type}-lr_${learning_rate}-lbl_${prep_label}-ftr_${prep_feature}-fcn_str_${fcn_string}-lmax_${lmax}-sigma_scale${sigma_scale}/"
# working_dir        : "otf_${features_type}2ps_${nn_model}_scales2_20kEp/pred_${spectrum_type}-lr_${learning_rate}-lbl_${prep_label}-ftr_${prep_feature}-fcn_str_${fcn_string}-lmax_${lmax}-sigma_scale${sigma_scale}/"
fig_model_name     : "On-The-Fly, ${nn_model} Nside ${nside} lmax ${lmax}, ${num_epochs}, ${input_kind} target ${spectrum_type} scale ${sigma_scale} \n Feature ${prep_feature} Target ${prep_label} Model ${fcn_string} \n lr ${learning_rate}"

