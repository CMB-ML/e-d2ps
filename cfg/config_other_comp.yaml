defaults:
  - config_pred_ps_base
  - _self_

# d2ps
# working_dir : "cmb2ps_TLPEnc2AggDec_train_coefs2/Nsims-2000_lr-0.0001_Adam_wd-0.0_sps-None_spx-local_meanstdv_pe-False_en-gn_gelu_r1-mXX_r2-avg_chebyshev18_1/"
working_dir : "obs2ps_1000_300ep/"
fig_model_name: "d2ps"
n_show_cap           : 10
use_epochs           : ["best"]

pipeline:
  predict:
    assets_out:
      cmb_ps:
        path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.txt"
  bundle_pred: # Z_bundle.py / BundlePredExecutor
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template: "{root}/{dataset}/{working}{stage}/pred_{split}_{epoch}.npy"
    assets_in:
      ps: {stage: predict, orig_name: cmb_ps}
