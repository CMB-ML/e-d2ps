defaults:
  - config_pred_ps_base
  - _self_

cleaning_model: "obs2ps"
working_dir: "obs2ps_use_mask_inv_test/drop_no_drop_scale_ps_none-scale_px_minmax_global-optimizer_Adam-lr_0.001-norm_bn-activation_gelu-down_XXXXXXXXX-spat_max/"
fig_model_name: "d2ps"
n_show_cap           : 10
use_epochs           : ["best"]

do_smooth            : false
sm_score_ell_max     : null

pipeline:
  predict:
    assets_out:
      cmb_ps:
        path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_pred_{epoch}.txt"
  bundle_pred: # Z_bundle.py / BundlePredExecutor
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template: "{root}/{dataset}/{working}{stage}/pred_{split}_{epoch}.npy"
    assets_in:
      ps: {stage: predict, orig_name: cmb_ps}
