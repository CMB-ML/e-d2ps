defaults:
  - config_real_ps
  - _self_

working_dir: "Sm_True_PS_${sm_basis_kind}_${sm_degree}_${out_range}/"

sigma_scale: 1
sm_basis_kind: chebyshev
sm_degree: 18
out_range: [-1, 1]
fig_model_name: "Smoothed Theory ${sm_basis_kind} ${sm_degree}"

pipeline:
  bundle_smooth_true:
    assets_out:
      ps_bundle:
        handler: NpyHandler
        path_template: "{root}/{dataset}/{working}{stage}/pred_{split}_{epoch}_smooth_${sm_basis_kind}_${sm_degree}_${out_range}.npy"
    assets_in:
      pred: {stage: bundle_true, orig_name: ps_bundle}
    splits:
      - ${splits.run_inference_on}
    epochs: ${use_epochs_ps_stats}
    dir_name: Analysis_Bundle
    make_stage_log: False
  new_metric_sm:
    assets_out:
      metric:
        path_template: "{root}/{dataset}/{working}{stage}/metrics_sm_true_{split}.txt"
      fig:
        path_template: "{root}/{dataset}/{working}{stage}/fig_H_sm_true_{split}_{metric}.{fig_type}"
    assets_in:
      pred: {stage: bundle_smooth_true, orig_name: ps_bundle}
