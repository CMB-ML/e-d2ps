defaults:
  - config_pred_ps_base
  - override splits: "1-1"
  - override pipeline: assembly_surr_real_on_planck
  - _self_

splits:
  name: 1850

working_dir : "cmbNNCS_UNet8_on_Planck/"
fig_model_name: "cmbNNCS on Planck"
n_show_cap           : 1
use_epochs           : ["best"]

pipeline:
  show_predictions:
    assets_in:
      ps_thry: 
        stage: make_theory_ps 
        orig_name: cmb_ps
        dataset: PlanckAsDataset_${scenario.nside}
    assets_out:
      fig:
        # Change file name
        path_template: "{root}/{dataset}/{working}{stage}/planck_real_ps.{fig_type}"
