# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_otf
  - override pipeline: assembly_on_sims_otf
  - _self_

hydra:
  mode: MULTIRUN
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}  # Should be the same as run.dir
    subdir     : ${hydra.job.num}               # Subsequent jobs will include duplicate logs for all previous jobs. 
                                                #   This is a minor bug, not worth fixing.
  verbose      : false
  sweeper:
    params:
      model_num           : ${model_num_sweep}
      lmax                : ${lmax_sweep}
      fcn_string: ${fcn_str_sweep}

      spectrum_type       : theory  # placeholder
      learning_rate       : 1e-3    # placeholder
      prep_label          : none    # placeholder
      prep_feature        : none    # placeholder

      # # SimpleEncDec
      # norm_kind           : none    # placeholder
      # activation          : relu    # placeholder
      # down_reductions     : avg     # placeholder
      # spatial_reduction   : avg     # placeholder

      # # TLPEncDec
      # norm_kind           : none    # placeholder
      # activation          : relu    # placeholder
      # down_reductions     : avg     # placeholder
      # spatial_reduction   : avg     # placeholder
      # face_reduction      : avg     # placeholder

      # Other
      sigma_scale: 1                  # placeholder
