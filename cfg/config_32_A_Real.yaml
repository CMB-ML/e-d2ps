defaults:
  - config_32
  - model/sim         : sim
  - override pipeline : assembly_surr_real_ps
  - _self_

pipeline:
  make_real_ps:
    assets_out:
      auto_real:
        path_template: "{root}/{dataset}/Real_PS/{stage}/{split}/{sim}/ps_real.npy"
    splits: [train, valid, test]
  bundle_real:
    splits: [train, valid, test]

hydra:
  mode: MULTIRUN
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}  # Should be the same as run.dir
    subdir     : ${hydra.job.num}               # Subsequent jobs will include duplicate logs for all previous jobs. 
                                                #   This is a minor bug, not worth fixing.
  verbose      : false
  sweeper:
    params:
      sigma_scale: ${sigma_scale_sweep}
      model_init: 1          # placeholder
      n_hidden_features: 0   # placeholder
      out_power: 1           # placeholder
      spectrum_type: theory  # placeholder
      learning_rate: 1e-3    # placeholder
      prep_label: none       # placeholder
      prep_feature: none     # placeholder
      activation: relu       # placeholder
