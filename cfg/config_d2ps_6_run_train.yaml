# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_

hydra:
  mode: MULTIRUN
  run:
    dir: Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir: Logs/${now:%Y-%m-%d-%H-%M-%S}
    subdir: ${hydra.job.num}
  verbose: false
  sweeper:
    params:
      holder: >-
        {act_: relu, norm_: bn, pool_: max, lr_: 2e-4, nsims_: 1000, sps_: null,      spx_: global_minmax,  feat_: obs},
        {act_: gelu, norm_: bn, pool_: max, lr_: 2e-4, nsims_: 1000, sps_: null,      spx_: global_minmax,  feat_: obs},
        {act_: relu, norm_: gn, pool_: max, lr_: 2e-4, nsims_: 1000, sps_: null,      spx_: global_minmax,  feat_: obs},
        {act_: relu, norm_: bn, pool_: avg, lr_: 2e-4, nsims_: 1000, sps_: null,      spx_: global_minmax,  feat_: obs},
        {act_: relu, norm_: bn, pool_: max, lr_: 2e-5, nsims_: 1000, sps_: null,      spx_: global_minmax,  feat_: obs},
        {act_: relu, norm_: bn, pool_: max, lr_: 2e-4, nsims_: 2000, sps_: null,      spx_: global_minmax,  feat_: obs},
        {act_: relu, norm_: bn, pool_: max, lr_: 2e-4, nsims_: 1000, sps_: meanstdv,  spx_: global_minmax,  feat_: obs},
        {act_: relu, norm_: bn, pool_: max, lr_: 2e-4, nsims_: 1000, sps_: null,      spx_: local_meanstdv, feat_: obs},
        {act_: relu, norm_: bn, pool_: max, lr_: 2e-4, nsims_: 1000, sps_: null,      spx_: global_minmax,  feat_: cmb}

holder: ???

activation:    ${holder.act_}
norm_kind:     ${holder.norm_}
pooling:       ${holder.pool_}
learning_rate: ${holder.lr_}
n_sims:        ${holder.nsims_}
scale_ps:      ${holder.sps_}
scale_px:      ${holder.spx_}
features_type: ${holder.feat_}
