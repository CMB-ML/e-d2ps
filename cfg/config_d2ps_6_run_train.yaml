# Do not name any yamls "default", "null", or "basic": these are reserved and will cause issues!
defaults:
  - config_d2ps
  - override pipeline: assembly_on_sims_sepprep
  - _self_

hydra:
  mode: MULTIRUN
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}  # Should be the same as run.dir
    subdir     : ${hydra.job.num}               # Subsequent jobs will include duplicate logs for all previous jobs. 
                                                #   This is a minor bug, not worth fixing.
  verbose      : false
  sweeper:
    params:
      # n_sims: ${n_sims_sweep}
      n_sims: 5

      # learning_rate: ${learning_rate_sweep}
      learning_rate: 2e-5

      scale_px: ${scale_px_sweep}
      # scale_px: global_minmax

      scale_ps: ${scale_ps_sweep}
      # scale_ps: 4000

      use_pos_enc_lut: ${use_pos_enc_lut_sweep}
      # use_pos_enc_lut: false

      # norm_kind: ${norm_sweep}
      norm_kind: none

      # activation: ${activation_sweep}
      activation: gelu

      down_reductions: ${down_reductions_sweep}

      spatial_reduction: ${spatial_reduction_sweep}

      # face_reduction: ${face_reduction_sweep}

      # model_num: ${model_num_sweep}
      model_num: 1

      # adamw_wd: ${adamw_wd_sweep}
      adamw_wd: 0.0

      basis_kind: ${basis_kind_sweep}
